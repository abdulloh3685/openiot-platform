name: OpenIoT CI

on:
  push:
    branches: [ main, 'reimplementation/**', 'phase-18/**', 'phase-24/**', 'phase-25/**', 'phase-26/**', 'phase-27/**', 'phase-28/**', 'phase-29/**', 'phase-30/**' ]
  pull_request:
    branches: [ main ]

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Native build
        run: pio run -e native
      - name: Core smoke test
        run: g++ -std=c++17 platform/core/src/core.cpp platform/core/test/test_core.cpp -Iplatform/foundation/include -Iplatform/core/include -o /tmp/openiot_core_smoke && /tmp/openiot_core_smoke
      - name: HAL smoke test
        run: g++ -std=c++17 platform/hal/src/hal.cpp platform/hal/test/test_hal.cpp -Iplatform/foundation/include -Iplatform/hal/include -o /tmp/openiot_hal_smoke && /tmp/openiot_hal_smoke
      - name: Driver smoke test
        run: g++ -std=c++17 platform/drivers/src/drivers.cpp platform/drivers/test/test_drivers.cpp -Iplatform/foundation/include -Iplatform/drivers/include -o /tmp/openiot_driver_smoke && /tmp/openiot_driver_smoke
      - name: Network smoke test
        run: g++ -std=c++17 platform/network/src/network.cpp platform/network/test/test_network.cpp -Iplatform/foundation/include -Iplatform/network/include -o /tmp/openiot_network_smoke && /tmp/openiot_network_smoke
      - name: Smart Farming smoke test
        run: g++ -std=c++17 platform/core/src/core.cpp platform/drivers/src/drivers.cpp products/smart-farming/src/smart_farming.cpp products/smart-farming/test/test_smart_farming.cpp -Iplatform/foundation/include -Iplatform/core/include -Iplatform/drivers/include -Iproducts/smart-farming/include -o /tmp/openiot_smart_farming_smoke && /tmp/openiot_smart_farming_smoke
      - name: Smart Farming telemetry smoke test
        run: g++ -std=c++17 platform/core/src/core.cpp platform/drivers/src/drivers.cpp platform/network/src/network.cpp products/smart-farming/src/smart_farming.cpp products/smart-farming/src/smart_farming_telemetry.cpp products/smart-farming/test/test_smart_farming_telemetry.cpp -Iplatform/foundation/include -Iplatform/core/include -Iplatform/drivers/include -Iplatform/network/include -Iproducts/smart-farming/include -o /tmp/openiot_smart_farming_telemetry_smoke && /tmp/openiot_smart_farming_telemetry_smoke
      - name: Integration and stress smoke test
        run: g++ -std=c++17 platform/core/src/core.cpp platform/drivers/src/drivers.cpp platform/network/src/network.cpp products/smart-farming/src/smart_farming.cpp products/smart-farming/src/smart_farming_telemetry.cpp products/smart-farming/test/test_integration.cpp -Iplatform/foundation/include -Iplatform/core/include -Iplatform/drivers/include -Iplatform/network/include -Iproducts/smart-farming/include -o /tmp/openiot_integration_smoke && /tmp/openiot_integration_smoke

  esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: ESP32 build
        run: pio run -e esp32dev
