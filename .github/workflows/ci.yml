name: OpenIoT CI

on:
  push:
    branches: [ main, 'reimplementation/**' ]
  pull_request:
    branches: [ main ]

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: platformio/action@v2
      - name: Native build and tests
        run: pio test -e native
