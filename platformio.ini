[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/build_metadata.py
monitor_speed = 115200
lib_extra_dirs = platform, products
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
build_flags =
    -Iplatform/foundation/include
    -Iplatform/core/include
    -Iplatform/hal/include
    -Iplatform/drivers/include
    -Iplatform/network/include
    -Iproducts/smart-farming/include

[env:native]
platform = native
extra_scripts = pre:scripts/build_metadata.py
lib_extra_dirs = platform, products
build_flags =
    -Iplatform/foundation/include
    -Iplatform/core/include
    -Iplatform/hal/include
    -Iplatform/drivers/include
    -Iplatform/network/include
    -Iproducts/smart-farming/include
