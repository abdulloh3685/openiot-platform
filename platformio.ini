[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = platform, products/smart-farming
lib_deps =
    knolleary/PubSubClient@^2.8
build_flags =
    -Iplatform/foundation/include
    -Iplatform/core/include
    -Iplatform/hal/include
    -Iplatform/drivers/include
    -Iplatform/network/include
    -Iproducts/smart-farming/include

[env:native]
platform = native
lib_extra_dirs = platform, products/smart-farming
build_flags =
    -Iplatform/foundation/include
    -Iplatform/core/include
    -Iplatform/hal/include
    -Iplatform/drivers/include
    -Iplatform/network/include
    -Iproducts/smart-farming/include
